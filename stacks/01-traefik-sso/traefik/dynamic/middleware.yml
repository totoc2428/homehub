# ==============================================================================
# Traefik Dynamic Middleware Configuration - Authelia ForwardAuth
# Location: stacks/01-traefik-sso/traefik/dynamic/middleware.yml
# ==============================================================================

http:
  middlewares:
    authelia:
      forwardAuth:
        address: "http://authelia:9091/api/verify?rd=http://auth.lan/"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Name"
          - "Remote-Email"
