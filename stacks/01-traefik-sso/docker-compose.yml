# ==============================================================================
# Stack 01: Traefik Reverse Proxy & Authelia SSO
# Location: stacks/01-traefik-sso/docker-compose.yml
# ==============================================================================

services:
  # --- TRAEFIK REVERSE PROXY ---
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard (Internal)
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${DOMAIN_TRAEFIK:-traefik.lan}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.middlewares=authelia@file"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # --- AUTHELIA SSO SERVER ---
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "9091:9091"
    environment:
      TZ: ${TZ:-Europe/Paris}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:-authelia_jwt_secret_change_me_super_secret_key}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:-authelia_session_secret_change_me_super_secret_key}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:-authelia_storage_encryption_key_change_me_32bytes}
    volumes:
      - ./authelia:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`${DOMAIN_AUTH:-auth.lan}`)"
      - "traefik.http.routers.authelia.entrypoints=web"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"

networks:
  proxy:
    external: true
    name: proxy
