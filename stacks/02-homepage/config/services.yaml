# ==============================================================================
# Homepage Services Configuration (Google App Launcher Style)
# Location: stacks/02-homepage/config/services.yaml
# ==============================================================================

- Medias & Photos:
    - Immich Photos:
        icon: immich.svg
        href: http://photos.lan
        description: Galerie & Sauvegarde photos familial (Protege par Authelia)
        container: immich_server
        widget:
          type: immich
          url: http://immich_server:2283
          key: ${IMMICH_API_KEY}

- Domotique & Reseau:
    - Home Assistant:
        icon: home-assistant.svg
        href: http://192.168.1.64:8123
        description: Centralisation domotique & objets connectes
        container: homeassistant
        widget:
          type: homeassistant
          url: http://192.168.1.64:8123
          key: ${HA_API_KEY}
    - OpenThread Router:
        icon: openthread.svg
        href: http://192.168.1.64:8081
        description: Border Router Thread (USB ttyThread)
        container: openthread
    - Matter Server:
        icon: matter.svg
        href: http://192.168.1.64:5580
        description: Controleur domotique Matter
        container: matter-server

- Administration & Systeme:
    - Pi-hole DNS:
        icon: pi-hole.svg
        href: http://192.168.1.53/admin
        description: Filtrage DNS local & Serveur DHCP (192.168.1.53)
        container: pihole
        widget:
          type: pihole
          url: http://192.168.1.53
          key: ${PIHOLE_PASSWORD}
    - Authelia SSO:
        icon: authelia.svg
        href: http://auth.lan
        description: Single Sign-On & Authentification centralisee
        container: authelia
    - Traefik Proxy:
        icon: traefik.svg
        href: http://traefik.lan
        description: Routeur Reverse Proxy HTTP/HTTPS (Admin Only)
        container: traefik
        widget:
          type: traefik
          url: http://traefik:8080
    - OpenMediaVault:
        icon: openmediavault.svg
        href: http://data.lan:81
        description: Administration NAS & Partages (Admin Only)
