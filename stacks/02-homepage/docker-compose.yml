# ==============================================================================
# Stack 02: Homepage Dashboard
# Location: stacks/02-homepage/docker-compose.yml
# ==============================================================================

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`${DOMAIN_DASH:-home.lan}`) || Host(`dash.lan`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      # SSO Authentication via Authelia ForwardAuth Middleware
      - "traefik.http.routers.homepage.middlewares=authelia@file"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
    name: proxy
